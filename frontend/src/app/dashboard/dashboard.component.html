<div class="dashboard">
  @switch (activeView()) {
    @case ('home') { <app-home-view></app-home-view> }
    @case ('weather') { <app-weather-view></app-weather-view> }
    @case ('transport') { <app-transport-view></app-transport-view> }
  }
  <div class="status">
    <app-status-indicator [status]="status()"></app-status-indicator>
  </div>
</div>
