<div class="home-view">
  @if (dashboard(); as d) {
    <section class="widget-grid" aria-label="Översikt">
      <button class="widget weather-widget" type="button" (click)="navigate.emit('weather')">
        <span class="eyebrow"><span aria-hidden="true">☀</span> VÄDER</span>
        <span class="weather-summary">
          <span class="weather-symbol" aria-hidden="true">{{ d.weather.symbol | weatherIcon }}</span>
          <span class="temperature">{{ d.weather.temperature }}°</span>
        </span>
        <span class="description">{{ d.weather.name }}</span>
        <span class="weather-meta">{{ d.weather.minimumTemperature }}°–{{ d.weather.maximumTemperature }}° · {{ d.weather.precipitationProbability }}% regn</span>
      </button>

      @if (d.airPatrol; as cabin) {
        <button class="widget cabin-widget" type="button" (click)="navigate.emit('cabin')">
          <span class="eyebrow"><span aria-hidden="true">⌂</span> {{ cabin.name }}</span>
          <strong class="large-value">{{ cabin.temperature }}°</strong>
          <span class="description">
            @if (cabin.humidity !== null) { {{ cabin.humidity }}% luftfuktighet }
          </span>
        </button>
      }

      <button class="widget transport-widget" type="button" (click)="navigate.emit('transport')">
        <span class="eyebrow">🚌 NÄSTA BUSS</span>
        @if (nextDeparture(); as departure) {
          <strong class="large-value">{{ departure.departure }}</strong>
          <span class="description">{{ departure.minutes }} minuter · {{ departure.destination }}</span>
        } @else {
          <span class="description">Inga kommande avgångar</span>
        }
      </button>

      <button class="widget calendar-widget" type="button" (click)="navigate.emit('calendar')">
        <span class="eyebrow">📅 IDAG</span>
        @if (nextEvent(); as event) {
          <strong class="large-value">{{ event.start }}</strong>
          <span class="description">{{ event.title }}</span>
        } @else {
          <span class="description">Inga kommande aktiviteter</span>
        }
      </button>

      <button class="widget timer-widget" type="button" (click)="navigate.emit('timers')">
        <span class="eyebrow">⏱ TIMERS</span>
        @if (d.timers.length) {
          <strong class="large-value">{{ d.timers[0].name }}</strong>
          <span class="description">{{ remainingTime(d.timers[0].endsAt) }} kvar · {{ d.timers.length }} aktiv</span>
        } @else {
          <strong class="large-value">--:--</strong>
          <span class="description">Inga aktiva timers</span>
        }
      </button>

      <section class="widget music-widget" (click)="navigate.emit('music')">
        <span class="eyebrow">♫ NU SPELAS</span>
        @if (d.music; as music) {
          <strong class="music-title">{{ music.title }}</strong>
          <span class="description">{{ music.artist }}</span>
          <button class="stop-button" type="button" [disabled]="stoppingMusic()" (click)="stopMusic($event)">
            ■ Stoppa
          </button>
        } @else {
          <strong class="large-value">Ingen musik</strong>
          <span class="description">Sök Spotify eller starta radio</span>
        }
      </section>

      <button class="widget news-widget" type="button" (click)="navigate.emit('news')">
        <span class="eyebrow">▤ SENASTE NYTT</span>
        <span class="news-headlines">
          @for (article of latestNews(); track article.url) {
            <span>{{ article.title }}</span>
          } @empty {
            <span class="description">Inga nyheter just nu</span>
          }
        </span>
      </button>
    </section>
  } @else {
    <div class="loading">Ansluter till HomePanel...</div>
  }
</div>
