<div class="home-view">
  @if (dashboard(); as d) {
    <section class="widget-grid" aria-label="Översikt">
      <button class="widget weather-widget" type="button" (click)="navigate.emit('weather')">
        <span class="eyebrow">VÄDER</span>
        <span class="weather-symbol">{{ d.weather.symbol }}</span>
        <span class="temperature">{{ d.weather.temperature }}°</span>
        <span class="description">{{ d.weather.name }}</span>
      </button>

      <button class="widget transport-widget" type="button" (click)="navigate.emit('transport')">
        <span class="eyebrow">🚌 NÄSTA BUSS</span>
        @if (nextDeparture(); as departure) {
          <strong class="large-value">{{ departure.departure }}</strong>
          <span class="description">{{ departure.minutes }} minuter · {{ departure.destination }}</span>
        } @else {
          <span class="description">Inga kommande avgångar</span>
        }
      </button>

      <button class="widget calendar-widget" type="button" (click)="navigate.emit('calendar')">
        <span class="eyebrow">📅 IDAG</span>
        @if (nextEvent(); as event) {
          <strong class="large-value">{{ event.start }}</strong>
          <span class="description">{{ event.title }}</span>
        } @else {
          <span class="description">Inga kommande aktiviteter</span>
        }
      </button>

      <button class="widget timer-widget" type="button" (click)="navigate.emit('timers')">
        <span class="eyebrow">⏱ TIMERS</span>
        @if (d.timers.length) {
          <strong class="large-value">{{ d.timers[0].name }}</strong>
          <span class="description">{{ remainingTime(d.timers[0].endsAt) }} kvar · {{ d.timers.length }} aktiv</span>
        } @else {
          <strong class="large-value">--:--</strong>
          <span class="description">Inga aktiva timers</span>
        }
      </button>

      <article class="widget music-widget">
        <span class="eyebrow">♫ NU SPELAS</span>
        <strong class="large-value">Ingen musik</strong>
        <span class="description">Musikspelare kommer senare</span>
      </article>
    </section>
  } @else {
    <div class="loading">Ansluter till HomePanel...</div>
  }
</div>
