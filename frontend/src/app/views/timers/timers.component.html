<section class="timers-view">
  <div class="section-heading">
    <div>
      <span class="eyebrow">⏱ TIMERS</span>
      <h1>Aktiva timers</h1>
    </div>
    <span class="timer-count">{{ timers().length }}</span>
  </div>

  <div class="active-timers">
    @for (timer of timers(); track timer.id) {
      <article class="timer-card">
        <div>
          <h2>{{ timer.name }}</h2>
          <span>Slut {{ timer.endsAt | date: 'HH:mm' }}</span>
        </div>
        <div class="timer-actions">
          <strong>{{ remainingTime(timer.endsAt) }}</strong>
          <button
            class="stop-button"
            type="button"
            [disabled]="cancelling() === timer.id"
            (click)="cancelTimer(timer.id)">
            {{ cancelling() === timer.id ? 'STOPPAR...' : 'STOPPA' }}
          </button>
        </div>
      </article>
    } @empty {
      <p class="empty-state">Inga aktiva timers.</p>
    }
  </div>

  <section class="new-timer">
    <div class="form-heading">
      <span class="eyebrow">NY TIMER</span>
      <button class="start-button" type="button" [disabled]="saving()" (click)="createTimer()">STARTA</button>
    </div>

    <label>
      Namn
      <input [value]="name()" (input)="updateName($event)" maxlength="40" required>
    </label>

    <div class="duration-fields">
      <label>Timmar<input type="number" min="0" max="168" [value]="hours()" (input)="updateHours($event)"></label>
      <label>Minuter<input type="number" min="0" max="59" [value]="minutes()" (input)="updateMinutes($event)"></label>
      <label>Sekunder<input type="number" min="0" max="59" [value]="seconds()" (input)="updateSeconds($event)"></label>
    </div>

    <div class="presets" aria-label="Snabbtider">
      <button type="button" (click)="setPreset('Ägg', 7)">Ägg · 7 min</button>
      <button type="button" (click)="setPreset('Pasta', 10)">Pasta · 10 min</button>
      <button type="button" (click)="setPreset('Pizza', 12)">Pizza · 12 min</button>
      <button type="button" (click)="setPreset(name(), 30)">30 min</button>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </section>
</section>
